name: opencode

# Интерактивный агент OpenCode 2: запускается командой в комментарии issue или
# pull request и отвечает в том же треде. Токена GitHub App в OpenCode 2 нет,
# поэтому ответ публикуется от github-actions[bot] правами из блока permissions.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Only authorised human commands are counted; this immutable run metadata is
# used by the budget gate, independently of comments made by the agent.
run-name: ${{ github.event.comment.user.type != 'Bot' && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) && (startsWith(github.event.comment.body, '/oc') || startsWith(github.event.comment.body, '/opencode') || contains(github.event.comment.body, ' /oc') || contains(github.event.comment.body, ' /opencode')) && (github.event.issue.pull_request != null || github.event.pull_request != null) && format('oc-pr-{0}', github.event.issue.number || github.event.pull_request.number) || 'opencode-other' }}

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    # Комментировать публичный репозиторий может кто угодно, поэтому job
    # запускается только по комментарию сопровождающего и с командой в тексте.
    # Комментарии ботов игнорируются, чтобы агент не отвечал сам себе.
    if: |
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, '/oc') ||
       startsWith(github.event.comment.body, '/opencode') ||
       contains(github.event.comment.body, ' /oc') ||
       contains(github.event.comment.body, ' /opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    outputs:
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check per-PR budget
        id: budget
        if: github.event.issue.pull_request != null || github.event.pull_request != null
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          rc=0
          bash scripts/check-opencode-budget.sh || rc=$?
          case "$rc" in
            0) echo 'reason=ok' >> "$GITHUB_OUTPUT" ;;
            2) echo 'reason=limit_exhausted' >> "$GITHUB_OUTPUT"; exit 1 ;;
            *) echo 'reason=infra' >> "$GITHUB_OUTPUT"; exit 1 ;;
          esac

      - name: Prepare trusted timeout wrapper
        run: cp scripts/run-with-timeout.py "$RUNNER_TEMP/run-with-timeout.py"

      - name: Verify pull request source
        if: github.event.issue.pull_request != null || github.event.pull_request != null
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          HEAD_REPOSITORY=$(gh pr view "$PR_NUMBER" --json headRepositoryOwner,headRepository --jq '.headRepositoryOwner.login + "/" + .headRepository.name')
          if [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then
            echo "Pull requests from forks are not supported."
            exit 1
          fi

      - name: Install project tools
        uses: jdx/mise-action@v2

      - name: Install OpenCode
        # Версия закреплена: CLI в CI не должен меняться между запусками.
        run: npm install --global @opencode/cli@2.3.0

      - name: Connect OpenCode Go
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: |
          test -n "$OPENCODE_GO_API_KEY"
          printf '[{"id":"cred_ci_opencode_go","integrationID":"opencode-go","label":"API key","active":true,"value":{"type":"key","key":"%s"}}]' \
            "$OPENCODE_GO_API_KEY" | opencode auth import --standalone

      - name: Check out pull request branch
        if: github.event.issue.pull_request != null || github.event.pull_request != null
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr checkout ${{ github.event.issue.number || github.event.pull_request.number }}

      - name: Run OpenCode
        id: agent
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || github.event.pull_request.number }}
          COMMENT: ${{ github.event.comment.body }}
          REVIEW_PATH: ${{ github.event.comment.path }}
          REVIEW_LINE: ${{ github.event.comment.line }}
          REVIEW_DIFF: ${{ github.event.comment.diff_hunk }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git

          PROMPT=$(cat <<EOF
          Ты — агент OpenCode в репозитории $GITHUB_REPOSITORY.
          Запрос пришёл комментарием в issue или pull request #$ISSUE:
          $COMMENT

          Если комментарий оставлен к строке диффа, речь о файле $REVIEW_PATH,
          строка $REVIEW_LINE. Окружающий diff:
          $REVIEW_DIFF

          Порядок работы:
          - Прочитай AGENTS.md, затем документы из docs/agents по теме задачи.
          - Обсуждение задачи читай командой gh issue view $ISSUE --comments,
            изменения pull request — командой gh pr diff.
          - В .agents/skills лежат скиллы to-spec, to-tickets и implement-spec.
            Подключай их по имени, если задача про спецификацию, тикеты или реализацию.
          - Ответ публикуй комментарием в тот же тред:
            gh issue comment $ISSUE --body-file <файл>.
          - Если нужны правки кода: новая ветка, коммит и push, затем дай ссылку
            на pull request, который открой командой gh pr create.
            Для pull request — коммит в его ветку.
          - Файл .github/workflows/hexlet-check.yml не изменяй.
          - Перед push запусти mise --locked run check:docs; если менял код —
            mise --locked run check и добейся успешного результата.
          EOF
          )

          set +e
          : > "$RUNNER_TEMP/opencode-timeout-marker"
          python3 "$RUNNER_TEMP/run-with-timeout.py" 1200 30 "$RUNNER_TEMP/opencode-timeout-marker" opencode run --standalone --auto \
            --model opencode-go/deepseek-v4.1-flash \
            "$PROMPT"
          rc=$?
          if [ -s "$RUNNER_TEMP/opencode-timeout-marker" ]; then
            echo 'reason=timeout' >> "$GITHUB_OUTPUT"
          elif [ "$rc" -ne 0 ]; then
            echo 'reason=agent_failed' >> "$GITHUB_OUTPUT"
          else
            echo 'reason=ok' >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      - name: Classify failure
        id: classify
        if: always()
        env:
          BUDGET_REASON: ${{ steps.budget.outputs.reason }}
          AGENT_REASON: ${{ steps.agent.outputs.reason }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
        run: |
          if [ "$BUDGET_REASON" = limit_exhausted ]; then reason=limit_exhausted
          elif [ "$AGENT_REASON" = timeout ]; then reason=timeout
          elif [ "$AGENT_REASON" = agent_failed ]; then reason=agent_failed
          elif [ "$AGENT_OUTCOME" = success ]; then reason=ok
          else reason=infra
          fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

  report:
    needs: opencode
    if: always() && needs.opencode.result != 'skipped' && needs.opencode.outputs.reason != 'ok'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Report failure without the model
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ needs.opencode.outputs.reason }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event.pull_request != null }}
        run: |
          [ -n "$REASON" ] || REASON=infra
          SHA=unknown
          if [ "$IS_PR" = true ]; then
            SHA=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha') || SHA=unknown
          fi
          printf 'Нужен человек. Причина: %s. Последний SHA: %s. [Логи запуска](%s/%s/actions/runs/%s/attempts/%s). Неопределённую причину проверьте по логам.\n' \
            "$REASON" "$SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/report.md"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --method POST -f "body=$(cat "$RUNNER_TEMP/report.md")"
